name: Compatibility

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: PostgreSQL ${{ matrix.postgres }} compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        postgres: ['14', '15', '16', '17', '18']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_DB: dupabase_maintenance_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-ci-fixture-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Backend checks
        env:
          DUPABASE_TEST_DATABASE_URL: postgresql://postgres:isolated-ci-fixture-password@127.0.0.1:5432/dupabase_maintenance_ci?sslmode=disable
        run: |
          go mod verify
          go vet ./cmd/... ./internal/...
          go test -race -count=1 ./cmd/... ./internal/...

  dashboard:
    name: Dashboard compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            dashboard/package-lock.json
      - name: Install dashboard dependencies
        run: |
          npm ci --ignore-scripts
          npm ci --ignore-scripts --prefix dashboard
      - name: Dashboard checks
        working-directory: dashboard
        run: |
          npm run lint
          npx --no-install tsc --noEmit
          npm run test:run
          npm run build

  runtime:
    name: SDK, backup, major upgrade and performance contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build candidate and baseline
        run: |
          docker build --file .deploy/_shared/Dockerfile --build-arg BUILD_REVISION="$GITHUB_SHA" --tag dupabase:compatibility .
          python3 tests/build_release_baseline.py
      - name: Run complete PostgreSQL and SDK matrix
        run: python3 tests/run_compatibility.py --image dupabase:compatibility --baseline-image dupabase:release-baseline --report compatibility-report.json
      - name: Save compatibility and performance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compatibility-and-performance
          path: compatibility-report.json
          if-no-files-found: ignore
          retention-days: 14
