name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

concurrency:
  group: dupabase-production
  cancel-in-progress: false

jobs:
  compatibility:
    uses: ./.github/workflows/ci.yaml
    permissions:
      contents: read

  security:
    uses: ./.github/workflows/security.yaml
    permissions:
      contents: read
      security-events: write
      packages: read

  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [compatibility, security]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set image name to lowercase
        id: meta
        run: echo "image_name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build exact production candidate
        run: docker build --file .deploy/_shared/Dockerfile --build-arg BUILD_REVISION="$GITHUB_SHA" --label "org.opencontainers.image.revision=$GITHUB_SHA" --tag dupabase:production .

      - name: Check the image before publishing
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          image-ref: dupabase:production
          scanners: vuln
          severity: 'UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL'
          ignore-unfixed: false
          exit-code: '1'

      - name: Login to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the checked image
        env:
          IMAGE_NAME: ${{ steps.meta.outputs.image_name }}
        run: |
          set -eu
          image="${REGISTRY}/${IMAGE_NAME}"
          docker tag dupabase:production "$image:prod-$GITHUB_SHA"
          docker tag dupabase:production "$image:prod-latest"
          docker push "$image:prod-$GITHUB_SHA"
          docker push "$image:prod-latest"

  deploy:
    name: Deploy
    runs-on: [self-hosted, Linux, X64, ansoragroup-shared]
    needs: [build-and-push]
    permissions:
      contents: read
    steps:
      - name: Trigger Watchtower
        env:
          WATCHTOWER_ENDPOINT: ${{ secrets.WATCHTOWER_ENDPOINT }}
          WATCHTOWER_TOKEN: ${{ secrets.WATCHTOWER_TOKEN }}
        run: |
          set -eu
          curl --fail --silent --show-error --max-time 120 --output /dev/null \
               -H "Authorization: Bearer ${WATCHTOWER_TOKEN}" \
               --request POST "${WATCHTOWER_ENDPOINT%/}/v1/update"

      - name: Verify deployment
        env:
          EXPECTED_REVISION: ${{ github.sha }}
          DEPLOY_HEALTH_URL: ${{ secrets.DEPLOY_HEALTH_URL }}
        run: |
          set -eu
          health_url="${DEPLOY_HEALTH_URL:-https://api.dupabase.dev/health}"
          echo "Waiting for the built revision..."
          for i in $(seq 1 12); do
            body=$(curl --fail --silent --show-error --max-time 5 "$health_url" || true)
            if [[ "$body" == *"\"revision\":\"${EXPECTED_REVISION}\""* ]]; then
              echo "Health check passed for the expected revision"
              exit 0
            fi
            echo "Attempt $i/12 did not confirm the revision, retrying..."
            sleep 5
          done
          echo "ERROR: Deployment did not become healthy at the expected revision"
          exit 1
